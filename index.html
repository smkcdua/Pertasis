<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurva Jasmani - Corduba</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <svg class="icon-sport" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                    <path d="M2 8h16v8H2V8z"></path>
                    <path d="M6 12h4"></path>
                </svg>
                <span>Corduba <strong>Cadikes</strong></span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="active">Catat Latihan</a>
                <a href="psikologi.html">Catat Psikologi</a>
                <a href="resume.html">Resume Realtime</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>Aplikasi Pencatatan Olahraga</h2>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div style="color:#334155; font-weight:700;">Waktu sekarang: <span id="currentTimeDisplayIndex">--:--:--</span></div>
            <div style="display:flex; flex-direction:column; align-items:flex-end;">
                <div style="color:#64748b;">Kelas hari ini: <span id="currentClassesDisplayIndex">-</span></div>
                <div style="color:#94a3b8; font-size:0.95rem; margin-top:4px;">Jam: <span id="currentClassesTimesIndex">-</span></div>
            </div>
        </div>
        
        <!-- Form Pengaturan Aktivitas -->
        <div class="form-group-inline">
            <div class="form-group">
                <label>Pilih Kelas</label>
                <select id="selectKelas" required>
                    <option value="">-- Memuat Data Kelas... --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mode Pencatatan</label>
                <select id="modePencatatan" required>
                    <option value="waktu">Waktu (Lari) - Stopwatch</option>
                    <option value="repetisi">Repetisi (Push/Sit-up) - Input Manual</option>
                </select>
            </div>
        </div>
        
        <div class="form-group-inline">
            <div class="form-group">
                <label>Jenis Aktivitas</label>
                <input type="text" id="jenisAktivitas" placeholder="Contoh: Sit Up / Lari 100m" required>
            </div>
            <div class="form-group">
                <label>Minggu Ke-</label>
                <input type="text" id="mingguKe" required placeholder="Contoh: Jumat, 14 Agustus 2026">
            </div>
            <div class="form-group">
                <label>Semester</label>
                <select id="semester" required>
                    <option value="1">Ganjil</option>
                    <option value="2">Genap</option>
                </select>
            </div>
        </div>

        <!-- Bagian Stopwatch Global -->
        <div id="stopwatchContainer" class="stopwatch-container">
            <div id="stopwatchDisplay" class="time-display">00:00:00</div>
            <div class="stopwatch-controls">
                <button id="btnStart" class="btn-start">Mulai</button>
                <button id="btnStop" class="btn-stop">Stop</button>
                <button id="btnReset" class="btn-reset">Reset</button>
            </div>
        </div>

        <!-- Daftar Siswa untuk Pencatatan Kolektif -->
        <div id="pencatatanContainer" style="display: none;">
            <h3 style="margin-top: 20px; border-bottom: 2px solid #3498db; padding-bottom: 5px;">Daftar Siswa</h3>
            <ul id="listSiswaPencatatan" class="student-list">
                <!-- Daftar anak akan dimunculkan oleh JavaScript di sini -->
            </ul>
            
            <button id="btnKirimKolektif" class="btn-kirim-kolektif">Kirim Semua Catatan</button>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
<footer class="footer">
        <p>&copy; 2026 Cardikes. Corduba Keren.</p>
    </footer>
</html>
